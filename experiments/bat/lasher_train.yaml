# SGTA-Track -- LasHeR main training config (paper Table 3, configuration A4).
#
# A4 turns on all four components (Table 3, M/S/R/L = +/+/+/+):
#   M  pre-head modality mixing            -> SGTA.USE_MOE
#   S  evidence-conditioned spatial enh.   -> SGTA.USE_MAMBA_FUSION
#   R  paired scoring + dynamic template   -> SGTA.USE_TEMPLATE_ROUTER / ENABLE_TEMPLATE_UPDATE
#   L  state-dependent update permission   -> SGTA.USE_LIQUID_CONTROLLER
#
# The explicit temporal-prediction branch of the v1 model is not part of the
# paper model and is disabled by both flags below (with only
# USE_TEMPORAL_MAMBA=False the constructor falls back to the legacy Gaussian
# predictor -- see lib/config/bat/config.py).
#
# Train:
#   python -u tracking/train.py --script bat --config lasher_train \
#       --save_dir ./output --mode single --nproc_per_node 1
DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN: [0.485, 0.456, 0.406]
  STD: [0.229, 0.224, 0.225]
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
    NUMBER: 1
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
    NUMBER: 2
  TRAIN:
    DATASETS_NAME: [LasHeR_train]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 60000
  VAL:
    DATASETS_NAME: [LasHeR_val]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 10000
MODEL:
  PRETRAIN_FILE: "./DropTrack_k700_800E_alldata.pth.tar"
  EXTRA_MERGER: False
  RETURN_INTER: False
  BACKBONE:
    TYPE: vit_base_patch16_224_ce_adapter
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [1, 1, 1]
    CE_TEMPLATE_RANGE: 'CTR_POINT'
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
  SGTA:
    ENABLED: True
    # no explicit temporal branch in the paper model
    USE_TEMPORAL_MAMBA: False
    USE_LEGACY_TEMPORAL_PREDICTOR: False
    # M / S / R / L
    USE_MOE: True
    USE_MAMBA_FUSION: True
    USE_TEMPLATE_ROUTER: True
    ENABLE_TEMPLATE_UPDATE: True
    USE_LIQUID_CONTROLLER: True
    # module hyper-parameters
    MAMBA_VERSION: 2
    MAMBA_D_STATE: 64
    MAMBA_D_CONV: 4
    MAMBA_EXPAND: 2
    MAMBA_HEAD_DIM: 64
    MOE_HIDDEN_DIM: 256
    LIQUID_HIDDEN_DIM: 64
    UPDATE_GATE_THRESHOLD: 0.5
TRAIN:
  # full fine-tuning from the DropTrack weights; the SGTA flags above decide
  # which modules exist, TRAIN_MODE decides which of them are trainable
  TRAIN_MODE: full
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  CE_START_EPOCH: 4
  CE_WARM_EPOCH: 16
  BATCH_SIZE: 12
  EPOCH: 30
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0001
  LR_DROP_EPOCH: 20
  NUM_WORKER: 10
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 1
  WEIGHT_DECAY: 0.0001
  AMP: False
  PROMPT:
    TYPE: bat_sgta
  FIX_BN: true
  SAVE_EPOCH_INTERVAL: 1
  SAVE_LAST_N_EPOCH: 1
  # one full LasHeR evaluation after every saved checkpoint
  EVAL_LASHER_EVERY_EPOCH: True
  EVAL_LASHER_EPOCH_INTERVAL: 1
  EVAL_LASHER_WORKERS: 4
  EVAL_LASHER_GPU: ""
  EVAL_LASHER_SAVE_DIR: "./RGBT_workspace/results"
  EVAL_LASHER_RESULTS_NS: ""
  EVAL_DATASET: lasher
TEST:
  EPOCH: 30
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
  WINDOW_INFLUENCE: 1.0
  PENALTY_K: 0.0
