# SGTA-Track -- VTUAV training config (short-term + long-term protocols).
#
# Same model as lasher_train.yaml (M/S/R/L all on, no explicit temporal branch);
# only the data and the optimisation recipe differ:
#   * DATA.TRAIN -> VTUAV_train (train split), DATA.VAL -> VTUAV_val_st
#   * 20000 samples/epoch at batch 4 = 5000 iterations/epoch
#   * LR 1e-5, 30 epochs, drop to 1e-6 at epoch 20
#
# Expected data layout (set VTUAV_HOME, default <RGBT_DATA_ROOT>/VTUAV):
#   $VTUAV_HOME/train/<seq>/{rgb,ir}      (+ rgb.txt / ir.txt / init.txt)
#   $VTUAV_HOME/test_ST/<seq>/{rgb,ir}
#   $VTUAV_HOME/test_LT/<seq>/{rgb,ir}
#
# Train:
#   python -u tracking/train.py --script bat --config vtuav_train \
#       --save_dir ./output --mode single --nproc_per_node 1
DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN: [0.485, 0.456, 0.406]
  STD: [0.229, 0.224, 0.225]
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
    NUMBER: 1
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
    NUMBER: 2
  TRAIN:
    DATASETS_NAME: [VTUAV_train]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 20000
  VAL:
    DATASETS_NAME: [VTUAV_val_st]
    DATASETS_RATIO: [1]
    SAMPLE_PER_EPOCH: 4000
MODEL:
  PRETRAIN_FILE: "./DropTrack_k700_800E_alldata.pth.tar"
  EXTRA_MERGER: False
  RETURN_INTER: False
  BACKBONE:
    TYPE: vit_base_patch16_224_ce_adapter
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [1, 1, 1]
    CE_TEMPLATE_RANGE: 'CTR_POINT'
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
  SGTA:
    ENABLED: True
    USE_TEMPORAL_MAMBA: False
    USE_LEGACY_TEMPORAL_PREDICTOR: False
    # M / S / R / L
    USE_MOE: True
    USE_MAMBA_FUSION: True
    USE_TEMPLATE_ROUTER: True
    ENABLE_TEMPLATE_UPDATE: True
    USE_LIQUID_CONTROLLER: True
    MAMBA_VERSION: 2
    MAMBA_D_STATE: 64
    MAMBA_D_CONV: 4
    MAMBA_EXPAND: 2
    MAMBA_HEAD_DIM: 64
    MOE_HIDDEN_DIM: 256
    LIQUID_HIDDEN_DIM: 64
    UPDATE_GATE_THRESHOLD: 0.5
TRAIN:
  TRAIN_MODE: full
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  CE_START_EPOCH: 4
  CE_WARM_EPOCH: 16
  BATCH_SIZE: 4
  EPOCH: 30
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  FOCAL_WEIGHT: 1.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.00001
  LR_DROP_EPOCH: 20
  NUM_WORKER: 4
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 1
  WEIGHT_DECAY: 0.0001
  AMP: False
  PROMPT:
    TYPE: bat_sgta
  FIX_BN: true
  SAVE_EPOCH_INTERVAL: 1
  SAVE_LAST_N_EPOCH: 1
  # no per-epoch benchmark during VTUAV training (a full ST sweep is expensive);
  # evaluate the saved checkpoints afterwards with RGBT_workspace/test_sgta.py
  EVAL_LASHER_EVERY_EPOCH: False
  EVAL_LASHER_EPOCH_INTERVAL: 1
  EVAL_LASHER_WORKERS: 1
  EVAL_LASHER_GPU: ""
  EVAL_LASHER_SAVE_DIR: "./RGBT_workspace/results"
  EVAL_LASHER_RESULTS_NS: ""
  EVAL_DATASET: vtuav_st
TEST:
  EPOCH: 30
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
  WINDOW_INFLUENCE: 1.0
  PENALTY_K: 0.0
